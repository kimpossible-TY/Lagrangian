name: Stage tinymist assets
description: Ensure preview HTML and runtime translations are available to compile tinymist.

inputs:
  use-existing:
    description: Download the tinymist-assets artifact when it is already present.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Download tinymist assets
      id: download
      if: inputs.use-existing == 'true'
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: tinymist-assets
        path: crates/tinymist-assets/src

    - name: Install Node.js
      if: inputs.use-existing != 'true' || steps.download.outcome != 'success'
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: yarn

    - name: Stage tinymist assets
      if: inputs.use-existing != 'true' || steps.download.outcome != 'success'
      shell: bash
      run: |
        yarn install --frozen-lockfile
        node scripts/stage-tinymist-assets.mjs

    - name: Upload tinymist assets
      if: inputs.use-existing != 'true' || steps.download.outcome != 'success'
      uses: actions/upload-artifact@v4
      with:
        name: tinymist-assets
        path: |
          crates/tinymist-assets/src/typst-preview.html
          crates/tinymist-assets/src/tinymist-rt.toml
        if-no-files-found: error
