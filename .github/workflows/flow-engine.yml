name: Flow engine

# Builds the Apple Silicon flow engine on a GitHub-hosted macOS runner.
# Runs on pushes to main, except documentation-only changes, and on manual
# dispatch. This is the only GitHub Actions workflow in the repo.
#
# fetch-engine downloads the artifact named flow-engine-darwin-arm64 and
# authenticates native-delivery-artifact.json and native-delivery-artifact.tar.
# The tar preserves flow-engine, flow-engine.sha256, release.json and this job's
# signed Lagrangian.app, including modes, symlinks and hidden payload files.
# Keep that artifact name. The engine-input hash lives in a separate artifact named
# flow-engine-input-<hash>.
#
# Every successful run also uploads the HTML Reader for this commit, on an
# engine cache hit and on a miss. Those sibling artifacts are
# reader-bundle-<headSha> and flow-reader-bundle. They are not engine inputs.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "openspec/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      jobs:
        description: Cargo jobs for the locked flow-release build
        required: false
        default: "2"
        type: string

permissions:
  contents: read
  # actions/upload-artifact@v4 and the Cargo cache use the Actions runtime
  # token. Listing and downloading a previous run's artifact uses this
  # GITHUB_TOKEN permission.
  actions: read

# A later run of the same ref cancels the older in-progress run.
concurrency:
  group: flow-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: macOS arm64 flow-release
    runs-on: macos-latest
    timeout-minutes: 360
    env:
      FLOW_ENGINE_JOBS: ${{ github.event.inputs.jobs || '2' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_dispatch checks out the selected ref. Full history lets
          # a cache-miss build embed git describe in the engine version.
          fetch-depth: 0

      - name: Require Apple Silicon
        run: |
          uname -m
          sw_vers
          df -h /
          test "$(uname -m)" = arm64

      - name: Package the reader bundle
        # Runs on a hit and miss. tools/flow-reader is outside the engine hash;
        # embedded reader-common/paged/DOM and specified build inputs remain included.
        # A web-only change still publishes a new bundle.
        run: python3 scripts/package-reader-bundle.py --head-sha "${{ github.sha }}" --worktree --output dist/reader-bundle

      - name: Hash engine inputs
        id: engine_inputs
        run: |
          set -euo pipefail
          os_name="$(uname -s)"
          arch_name="$(uname -m)"
          test "$os_name" = Darwin
          test "$arch_name" = arm64
          hash="$(python3 scripts/engine-input-hash.py --os "$os_name" --arch "$arch_name")"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "Engine input hash: $hash" >> "$GITHUB_STEP_SUMMARY"

      - name: Reuse a published engine when inputs match
        id: engine_cache
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_INPUT_HASH: ${{ steps.engine_inputs.outputs.hash }}
          ENGINE_ARTIFACT_DIR: dist/engine-input
          # main is the Mac updater's branch. The current ref is included so a
          # second dispatch of this branch can reuse the artifact it just built.
          # Duplicate names are ignored by the script.
          ENGINE_REUSE_BRANCHES: main ${{ github.ref_name }}
        run: python3 scripts/reuse-engine-artifact.py

      - name: Free disk for the ThinLTO target directory
        if: steps.engine_cache.outputs.hit != 'true'
        run: |
          # Hosted macOS images keep simulator runtimes on a small disk.
          # The flow-release target directory needs that space. Xcode stays installed.
          sudo rm -rf /Library/Developer/CoreSimulator/Volumes/* || true
          sudo rm -rf "$HOME/Library/Developer/CoreSimulator/Caches" || true
          sudo rm -rf "$HOME/Library/Developer/CoreSimulator/Devices" || true
          df -h /

      - uses: actions/setup-node@v4
        if: steps.engine_cache.outputs.hit != 'true'
        with:
          node-version: 24
          cache: yarn

      - name: Install frontend dependencies
        if: steps.engine_cache.outputs.hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Prepare embedded preview and localization assets
        if: steps.engine_cache.outputs.hit != 'true'
        run: node scripts/stage-tinymist-assets.mjs

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: steps.engine_cache.outputs.hit != 'true'
        with:
          rustflags: -Dwarnings
          # Swatinem/rust-cache (via setup-rust-toolchain). The shared key
          # namespaces the flow-release Apple Silicon target; the action also
          # keys on the toolchain and Cargo.lock.
          cache-shared-key: flow-release-aarch64-apple-darwin
          cache-on-failure: true
          cache-targets: true
          cache-all-crates: true
          cache-save-if: "true"

      - name: Build the native engine input
        if: steps.engine_cache.outputs.hit != 'true'
        run: |
          case "$FLOW_ENGINE_JOBS" in
            ''|*[!0-9]*|0) echo "jobs must be a positive integer" >&2; exit 1 ;;
          esac
          python3 scripts/flow-app.py build-engine-input --jobs "$FLOW_ENGINE_JOBS" --output dist/engine-input

      - name: Prepare portable native dependencies
        run: |
          python3 scripts/stage-native-reader-delivery.py acquire --backend . --output dist/native-dependencies
          dist/native-dependencies/portable-node/node-v22.23.5-darwin-arm64/bin/node scripts/prepare-native-reader-runtime.mjs \
            --runtime-source dist/native-dependencies/runtime-source \
            --helper tools/flow-reader/native/math_layout.mjs \
            --node "$PWD/dist/native-dependencies/portable-node/node-v22.23.5-darwin-arm64/bin/node" \
            --output dist/native-runtime --identity -

      - name: Stage current backend and runtime on hit and miss
        run: |
          python3 scripts/stage-native-reader-delivery.py unpack-reader --bundle dist/reader-bundle --output dist/current-reader
          python3 scripts/stage-native-reader-delivery.py binding --backend . --engine dist/engine-input/flow-engine --runtime-source dist/native-runtime --helper tools/flow-reader/native/math_layout.mjs --reader-bundle dist/current-reader --output dist/delivery-input.json
          python3 scripts/stage-native-reader-delivery.py stage --manifest dist/delivery-input.json --backend . --engine dist/engine-input/flow-engine --runtime-source dist/native-runtime --helper tools/flow-reader/native/math_layout.mjs --reader-bundle dist/current-reader --python-archive dist/native-dependencies/python/python-3.13.11-macos11.pkg --compiler dist/native-dependencies/compiler/typst-aarch64-apple-darwin/typst --typst-packages dist/native-dependencies/compiler/packages --certifi-wheel dist/native-dependencies/python/certifi-2026.10.23-py3-none-any.whl --output "$RUNNER_TEMP/native-delivery" --identity -

      - name: Build current native app on hit and miss
        run: python3 scripts/flow-app.py build --engine dist/engine-input/flow-engine --engine-provenance dist/engine-input/release.json --delivery "$RUNNER_TEMP/native-delivery" --identity -

      - name: Stage the engine artifact
        run: |
          python3 scripts/flow-app.py stage-engine-artifact \
            --app dist/Lagrangian.app \
            --engine dist/engine-input/flow-engine \
            --output dist/flow-engine-darwin-arm64
          du -sh dist/flow-engine-darwin-arm64 dist/flow-engine-darwin-arm64/native-delivery-artifact.tar

      - name: Record the published engine
        env:
          ENGINE_INPUT_HASH: ${{ steps.engine_inputs.outputs.hash }}
          ENGINE_CACHE_HIT: ${{ steps.engine_cache.outputs.hit }}
          ENGINE_SOURCE_RUN: ${{ steps.engine_cache.outputs.source_run }}
        run: |
          set -euo pipefail
          mkdir -p dist/engine-input-marker
          printf '%s\n' "$ENGINE_INPUT_HASH" > dist/engine-input-marker/engine-input.sha256
          {
            echo "### flow-engine-darwin-arm64"
            echo
            echo "- Engine input hash: \`$ENGINE_INPUT_HASH\`"
            echo "- Cache: \`$ENGINE_CACHE_HIT\`"
            if [ "$ENGINE_CACHE_HIT" = true ]; then
              echo "- Reused run: \`$ENGINE_SOURCE_RUN\`"
            fi
            echo "- SHA-256: \`$(awk '{print $1}' dist/engine-input/flow-engine.sha256)\`"
            echo "- Reader bundle: \`reader-bundle-${{ github.sha }}\` and \`flow-reader-bundle\`"
            echo "- Reader headSha: \`$(python3 -c 'import json; print(json.load(open("dist/reader-bundle/reader-bundle.json"))["headSha"])')\`"
            echo "- Reader bundleChecksum: \`$(python3 -c 'import json; print(json.load(open("dist/reader-bundle/reader-bundle.json"))["bundleChecksum"])')\`"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Apple Silicon flow engine
        uses: actions/upload-artifact@v4
        with:
          name: flow-engine-darwin-arm64
          path: |
            dist/flow-engine-darwin-arm64/native-delivery-artifact.json
            dist/flow-engine-darwin-arm64/native-delivery-artifact.tar
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

      - name: Upload engine input hash
        uses: actions/upload-artifact@v4
        with:
          name: flow-engine-input-${{ steps.engine_inputs.outputs.hash }}
          path: dist/engine-input-marker
          retention-days: 30
          if-no-files-found: error
          compression-level: 6

      - name: Upload reader bundle
        uses: actions/upload-artifact@v4
        with:
          name: reader-bundle-${{ github.sha }}
          path: dist/reader-bundle
          retention-days: 30
          if-no-files-found: error
          compression-level: 6

      - name: Upload stable reader bundle
        uses: actions/upload-artifact@v4
        with:
          name: flow-reader-bundle
          path: dist/reader-bundle
          retention-days: 30
          if-no-files-found: error
          compression-level: 6
