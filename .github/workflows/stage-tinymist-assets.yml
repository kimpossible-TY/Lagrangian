# Publishes gitignored tinymist assets before cargo-dist builds them into binaries.
# cargo-dist wires this in as a plan job from dist-workspace.toml.

name: tinymist::stage-assets
on:
  workflow_call:

jobs:
  stage:
    name: Stage tinymist assets
    runs-on: ubuntu-22.04
    steps:
      - name: Fetch sources
        uses: actions/checkout@v4

      - name: Stage tinymist assets
        uses: ./.github/actions/stage-tinymist-assets
