name: Reader quality

# Keep PR feedback independent of the engine cache/build and Mac deployment.
# No path filter: a required Reader check must not remain pending on docs PRs.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readers:
    name: Reader lint and tests
    # Includes macOS-only installed-layout tests, using isolated temporary data.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22
      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile
      - name: Lint first-party readers
        run: yarn lint:readers
      - name: Check reader boundaries and import cycles
        run: yarn test:architecture
      - name: Test readers and DOM rendering
        # This base suite reports optional compiler/editor skips. It does not
        # replace test:reader-integration, browser fixtures or device testing.
        run: yarn test:readers

  duplication-report:
    name: Reader duplication (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The entire pilot is advisory, including checkout/setup/install failures.
    # Do not make this job a required branch-protection check.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned jscpd binary
        id: install
        # Official npm package ships prebuilt binaries; no Rust compilation.
        run: npm install --global jscpd@5.4.3
      - name: Report Reader duplication
        id: scan
        run: npm run report:duplicates
      - name: Summarize advisory result
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          {
            echo '## Reader duplication pilot (report only)'
            echo
            echo "- Tool installation: $INSTALL_OUTCOME"
            echo "- Scan: $SCAN_OUTCOME"
            echo '- Findings and tool failures do not block Reader checks or engine delivery.'
            echo '- Scope: Reader JavaScript, TypeScript and Python; excludes tests, vendor and generated files.'
            echo '- Swift and Rust are outside this pilot. Matches require review, not automatic extraction.'
            echo
            if [ "$SCAN_OUTCOME" = success ] && [ -f dist/reports/jscpd/jscpd-report.md ]; then
              cat dist/reports/jscpd/jscpd-report.md
            else
              echo 'No completed baseline is available. Inspect the installation/scan logs.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload duplication reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-duplication-${{ github.sha }}
          path: dist/reports/jscpd/
          if-no-files-found: warn
          retention-days: 14
