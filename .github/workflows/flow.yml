name: Flow app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readers:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Lint reader browser and Node code
        run: yarn lint:readers
      - name: Check reader contracts, architecture and installed layout
        run: yarn test:readers
      - name: Check reader types
        run: |
          yarn tsc --noEmit -p tools/typst-preview-frontend/tsconfig.json
          yarn tsc --noEmit -p tools/typst-dom/tsconfig.json
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test current Swift sources and packaging
        run: python3 -m unittest discover -s tests/flow-app -v
      - name: Check documentation generator syntax
        run: node --check scripts/link-docs.mjs
      - uses: typst-community/setup-typst@v4
      - name: Compile Flow documentation
        run: |
          mkdir -p dist/docs
          typst compile --root . docs/tinymist/tinymist-flow.typ dist/docs/README.pdf
          typst compile --root . docs/tinymist/dev/development.typ dist/docs/development.pdf
          typst compile --root . docs/tinymist/flow-app.typ dist/docs/UserGuide.pdf
