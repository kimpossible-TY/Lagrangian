<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; worker-src 'self' blob:"
    />
    <title>Reader 수식 조판 경로 검사</title>
    <link rel="stylesheet" href="reader.css" />
    <link rel="stylesheet" href="source-style.css" />
    <style>
      html {
        overflow-y: scroll;
      }
      body {
        margin: 16px;
      }
      #report {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font: 12px/1.5 monospace;
      }
      #reader-document {
        position: fixed;
        left: -100000px;
        top: 0;
        margin: 0;
        padding: 0;
        visibility: hidden;
      }
      #previews > section {
        margin-block: 1.5em;
        border-top: 1px solid #888;
      }
    </style>
    <script type="module" src="math-runtime.js"></script>
  </head>
  <body>
    <h1>실제 Reader 조판 경로</h1>
    <p id="progress" role="status">준비 중…</p>
    <article id="reader-document" aria-hidden="true" inert></article>
    <main id="previews"></main>
    <pre id="report"></pre>
  </body>
</html>
